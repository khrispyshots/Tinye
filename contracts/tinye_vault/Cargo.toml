[package]
name = "tinye-vault"
version = "0.1.0"
edition = "2021"
description = "Tinye non-custodial goal earmarking and savings vault on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.2", features = ["legacy"] }
borsh = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"

[dev-dependencies]
near-sdk = { version = "=5.30.2", features = ["unit-testing", "legacy"] }
tokio = { version = "1.0", features = ["full"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

